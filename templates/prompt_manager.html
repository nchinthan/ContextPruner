<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-950 text-gray-100">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Prompt Hierarchy & Manager</title>
      <script src="https://cdn.tailwindcss.com"></script>
      <!-- Correct absolute static path -->
      <script type="module" src="{{ url_for('static', filename='js/promptPage/main.js') }}"></script>
   </head>

   <style>
      /* Custom Dark Scrollbar for Tree Container */
      #tree-container::-webkit-scrollbar {
         width: 6px;
      }

      #tree-container::-webkit-scrollbar-track {
         background: transparent;
      }

      #tree-container::-webkit-scrollbar-thumb {
         background-color: #374151; /* gray-700 */
         border-radius: 9999px;
      }

      #tree-container::-webkit-scrollbar-thumb:hover {
         background-color: #4b5563; /* gray-600 */
      }

      /* Firefox Support */
      #tree-container {
         scrollbar-width: thin;
         scrollbar-color: #374151 transparent;
      }
   </style>

   <body
      class="h-full flex flex-col font-sans antialiased selection:bg-indigo-500 selection:text-white"
   >
      <app-header title="Prompt Hierarchy Manager">
         <!-- Status Badge -->
         <span
            id="api-status"
            class="text-xs px-2 py-0.5 rounded-full bg-amber-500/10 text-amber-400 border border-amber-500/20"
         >
            Connecting...
         </span>

         <!-- Page Specific Action Buttons -->
         <button
            id="btn-refresh-tree"
            class="bg-gray-800 hover:bg-gray-700 text-gray-300 px-3 py-1.5 rounded-lg text-xs font-medium transition flex items-center gap-1.5"
         >
            <svg
               class="w-3.5 h-3.5"
               fill="none"
               stroke="currentColor"
               viewBox="0 0 24 24"
            >
               <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"
               ></path>
            </svg>
            Refresh Tree
         </button>

         <button
            id="btn-new-root"
            class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1.5 rounded-lg text-xs font-medium transition shadow-md hover:shadow-indigo-500/20 flex items-center gap-1.5"
         >
            <svg
               class="w-3.5 h-3.5"
               fill="none"
               stroke="currentColor"
               viewBox="0 0 24 24"
            >
               <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M12 4v16m8-8H4"
               ></path>
            </svg>
            + New Root Prompt
         </button>
      </app-header>

      <div class="flex-1 flex overflow-hidden">
         <tree-view></tree-view>

         <main class="flex-1 bg-gray-950 flex flex-col min-w-0">
            <div
               id="editor-empty"
               class="flex-1 flex flex-col items-center justify-center text-gray-500 p-6"
            >
               <svg
                  class="w-12 h-12 text-gray-700 mb-3"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
               >
                  <path
                     stroke-linecap="round"
                     stroke-linejoin="round"
                     stroke-width="1.5"
                     d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"
                  ></path>
               </svg>
               <p class="text-sm">
                  Select a prompt node from the left tree to view and edit its
                  content.
               </p>
            </div>

            <div
               id="editor-container"
               class="flex-1 flex flex-col hidden overflow-hidden"
            >
               <div
                  class="px-6 py-4 border-b border-gray-800 bg-gray-900/60 flex items-center justify-between shrink-0"
               >
                  <div>
                     <div class="flex items-center gap-2">
                        <h2
                           id="current-node-name"
                           class="text-lg font-semibold text-gray-100"
                        >
                           Node Name
                        </h2>
                        <span
                           id="current-node-badge"
                           class="px-2 py-0.5 text-xs rounded bg-gray-800 text-gray-300 font-mono"
                           >Leaf</span
                        >
                     </div>
                     <p
                        id="current-node-path"
                        class="text-xs text-gray-500 font-mono mt-0.5"
                     >
                        /path/to/node
                     </p>
                  </div>

                  <div class="flex items-center gap-3">
                     <button
                        id="add-child-btn"
                        class="bg-gray-800 hover:bg-gray-700 text-gray-200 px-3 py-1.5 rounded-lg text-xs font-medium transition flex items-center gap-1.5"
                     >
                        + Add Sub-node
                     </button>
                     <button
                        id="btn-delete-node"
                        class="bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/20 px-3 py-1.5 rounded-lg text-xs font-medium transition"
                     >
                        Delete
                     </button>
                     <button
                        id="btn-save-script"
                        class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-1.5 rounded-lg text-xs font-medium transition shadow-md hover:shadow-emerald-500/20 flex items-center gap-1.5"
                     >
                        Save Changes
                     </button>
                  </div>
               </div>

               <prompt-script-editor></prompt-script-editor>
            </div>
         </main>
      </div>

      <prompt-create-modal id="create-modal"></prompt-create-modal>
   </body>
</html>
