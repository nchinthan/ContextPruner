<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>AI Prompt Builder</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<!-- Correct absolute static path -->
        <script type="module" src="{{ url_for('static', filename='js/index_page/main.js') }}"></script>

<style>
            /* Custom Scrollbar for sleek UI */
            ::-webkit-scrollbar {
                width: 6px;
                height: 6px;
            }
            ::-webkit-scrollbar-track {
                background: #1f2937;
            }
            ::-webkit-scrollbar-thumb {
                background: #4b5563;
                border-radius: 3px;
            }
            ::-webkit-scrollbar-thumb:hover {
                background: #6b7280;
            }
        </style>
    </head>
    <body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col font-sans">
        <!-- Header -->
        <app-header title="Prompt Workspace"></app-header>
        
        <main class="flex-1  w-full mx-auto flex flex-col gap-6" >
            <project-init></project-init>  
            <page-container>
                <!-- Default / First Page -->
                <page name="prompt">
                    <div class="flex items-start gap-4 w-full">
                        <snippet-drawer side="left"></snippet-drawer>
                        <prompt-editor class="flex-1"></prompt-editor>
                    </div>
                </page>

                <page name="codebase">
                    <div class="flex h-[calc(100vh-5rem)] w-full overflow-hidden rounded-xl border border-gray-800 bg-gray-900">
                    <node-viewer-tree-view></node-viewer-tree-view>
                    <node-code-editor class="flex-1 flex flex-col p-6 min-h-0 bg-gray-950"></node-code-editor>
                    </div>
                </page>

                <!-- Additional Page Placeholder for Future Expansion -->
                <page name="settings">
                    <div class="bg-gray-900 border border-gray-800 rounded-xl p-6">
                        <h2 class="text-lg font-medium text-gray-200 mb-2">Workspace Settings</h2>
                        <p class="text-sm text-gray-400">Future configuration settings can go here.</p>
                    </div>
                </page>
            </page-container>
        </main>

        <output-modal></output-modal>
    </body>
</html>
